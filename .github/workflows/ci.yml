name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: denosys_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: denosys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DENOSYS_TEST_MYSQL_HOST: 127.0.0.1
      DENOSYS_TEST_MYSQL_PORT: 3306
      DENOSYS_TEST_MYSQL_DATABASE: denosys_test
      DENOSYS_TEST_MYSQL_USERNAME: root
      DENOSYS_TEST_MYSQL_PASSWORD: test
      DENOSYS_TEST_PGSQL_HOST: 127.0.0.1
      DENOSYS_TEST_PGSQL_PORT: 5432
      DENOSYS_TEST_PGSQL_DATABASE: denosys_test
      DENOSYS_TEST_PGSQL_USERNAME: postgres
      DENOSYS_TEST_PGSQL_PASSWORD: test
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migration regression tests
        run: composer test

      - name: Check model metadata types
        run: composer analyse

      - name: PHP syntax check
        run: |
          if [ -d src ]; then
            find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "No src/ directory to lint."
          fi

      - name: Database regression tests
        run: composer test
