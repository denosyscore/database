name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Database tests (SQLite)
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: PHP syntax check
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  servers:
    # Supported versions follow the vendor support policy in the workspace AGENTS.md:
    # the minimum and the latest supported release of each database.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4 LTS
            family: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -ptest
          - name: MySQL 9
            family: mysql
            image: mysql:9
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -ptest
          - name: MariaDB 10.11 LTS
            family: mysql
            image: mariadb:10.11
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4 LTS
            family: mysql
            image: mariadb:11.4
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
          - name: PostgreSQL 15
            family: pgsql
            image: postgres:15
            port: 5432
            health: pg_isready -U postgres
          - name: PostgreSQL 17
            family: pgsql
            image: postgres:17
            port: 5432
            health: pg_isready -U postgres
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: denosys_test
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: denosys_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: denosys_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      # Only the variables for the running family are set; the other family's tests skip.
      DENOSYS_TEST_MYSQL_HOST: 127.0.0.1
      DENOSYS_TEST_MYSQL_PORT: 3306
      DENOSYS_TEST_MYSQL_DATABASE: ${{ matrix.family == 'mysql' && 'denosys_test' || '' }}
      DENOSYS_TEST_MYSQL_USERNAME: root
      DENOSYS_TEST_MYSQL_PASSWORD: test
      DENOSYS_TEST_PGSQL_HOST: 127.0.0.1
      DENOSYS_TEST_PGSQL_PORT: 5432
      DENOSYS_TEST_PGSQL_DATABASE: ${{ matrix.family == 'pgsql' && 'denosys_test' || '' }}
      DENOSYS_TEST_PGSQL_USERNAME: postgres
      DENOSYS_TEST_PGSQL_PASSWORD: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Database tests against ${{ matrix.name }}
        run: composer test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      # Level max with a frozen baseline: new errors fail, and fixed errors
      # must be removed from phpstan-baseline.neon.
      - name: PHPStan
        run: composer analyse

      - name: Type inference fixtures
        run: composer analyse:types
